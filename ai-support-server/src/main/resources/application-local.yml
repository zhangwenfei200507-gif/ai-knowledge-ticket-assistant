spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/ai_support
    username: ai_support
    password: change_me_locally
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6380
      password: change_me_locally
      database: 0

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.zwf.aisupport.entity
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    secret: this-is-a-local-dev-secret-key-for-ai-support-server-please-change-later
    ttl: 7200000
  llm:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${OPENAI_MODEL:gpt-4o-mini}

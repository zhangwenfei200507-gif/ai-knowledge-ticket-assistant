spring:
  config:
    import: optional:file:../.env[.properties]
  flyway:
    enabled: ${DB_MIGRATION_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: ${DB_MIGRATION_BASELINE_ON_MIGRATE:false}
    baseline-version: ${DB_MIGRATION_BASELINE_VERSION:23}
    validate-on-migrate: true
    clean-disabled: true
  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB:ai_support}
    username: ${POSTGRES_USER:ai_support}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6380
      password: ${REDIS_PASSWORD}
      database: 0

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.zwf.aisupport.entity
  configuration:
    map-underscore-to-camel-case: true

app:
  environment:
    name: ${APP_ENVIRONMENT_NAME:Local}
  schema:
    validation:
      enabled: ${APP_SCHEMA_VALIDATION_ENABLED:true}
      mode: ${APP_SCHEMA_VALIDATION_MODE:WARN}
  oauth:
    frontend-callback-url: ${OAUTH_FRONTEND_CALLBACK_URL:http://localhost:5173/auth/callback}
    backend-base-url: ${OAUTH_BACKEND_BASE_URL:http://127.0.0.1:8090}
    exchange-code-ttl-seconds: ${OAUTH_EXCHANGE_CODE_TTL_SECONDS:60}
    bootstrap-admin-emails: ${APP_BOOTSTRAP_ADMIN_EMAILS:zhangwenfei200507@gmail.com}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
  jwt:
    secret: ${APP_JWT_SECRET}
    ttl: 7200000
  llm:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${OPENAI_MODEL:gpt-5-nano}
      max-evidence-chars: ${OPENAI_MAX_EVIDENCE_CHARS:4800}
      max-source-chars: ${OPENAI_MAX_SOURCE_CHARS:1200}
      max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:700}
      max-retries: ${OPENAI_MAX_RETRIES:1}
      retry-backoff-ms: ${OPENAI_RETRY_BACKOFF_MS:250}
      reasoning-effort: ${OPENAI_REASONING_EFFORT:low}
      input-price-per-million: ${OPENAI_INPUT_PRICE_PER_MILLION:}
      output-price-per-million: ${OPENAI_OUTPUT_PRICE_PER_MILLION:}
  ai:
    routing:
      grounded-synthesis-enabled: ${AI_GROUNDED_SYNTHESIS_ENABLED:true}
      direct-fallback-enabled: ${AI_DIRECT_FALLBACK_ENABLED:true}
      grounded-synthesis-source-types: ${AI_GROUNDED_SYNTHESIS_SOURCE_TYPES:ARTICLE,DOCUMENT,WEB}
      max-grounded-sources: ${AI_MAX_GROUNDED_SOURCES:4}
      max-preview-chars-per-source: ${AI_MAX_PREVIEW_CHARS_PER_SOURCE:1200}
      max-question-chars-for-direct-fallback: ${AI_MAX_DIRECT_FALLBACK_QUESTION_CHARS:800}
    steward:
      llm-enabled: ${AI_STEWARD_LLM_ENABLED:true}
  search:
    serper:
      api-key: ${SERPER_API_KEY:}
      base-url: ${SERPER_BASE_URL:https://google.serper.dev}
